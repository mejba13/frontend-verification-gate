<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean fixture — should PASS</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; color: #111; background: #fff; }
    button { min-height: 44px; min-width: 44px; padding: .7rem 1.1rem; font-size: 1rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0057d9; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Clean fixture</h1>
    <p>No console errors, no failed requests, no accessibility violations.</p>
    <button data-testid="like" aria-label="Like this post">Like</button>
    <span data-testid="count">0</span>
  </main>
  <script>
    const btn = document.querySelector('[data-testid=like]');
    btn.addEventListener('click', () => {
      const c = document.querySelector('[data-testid=count]');
      c.textContent = String(+c.textContent + 1);
      btn.textContent = 'Liked';
    });
  </script>
</body>
</html>
